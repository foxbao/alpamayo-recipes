# Local VLA-KL sample config for a data/forward smoke test and later SFT runs.
# The current train/validation split is by source data group, not by event window.
defaults:
  - sft_base
  - /models/ar1_5_base@model
  - override /vla_processor@data.train_dataset.vla_preprocess_args: local_coc
  - override /vla_processor@data.val_dataset.vla_preprocess_args: local_coc
  - _self_

data:
  train_dataset:
    _target_: alpamayo1_5_sft.datasets.local_record.LocalRecordDataset
    _recursive_: false
    local_dir: null
    sample_root: ???
    formal_versions: ???
    vla_preprocess_args:
      generation_mode: false
  val_dataset:
    _target_: alpamayo1_5_sft.datasets.local_record.LocalRecordDataset
    _recursive_: false
    local_dir: null
    sample_root: ${data.train_dataset.sample_root}
    formal_versions: ???
    vla_preprocess_args:
      generation_mode: true

trainer:
  lr_multiplier:
    vlm.model.visual: 0.1
  ddp_find_unused_parameters: false
  gradient_accumulation_steps: 4
  learning_rate: 1e-5
  warmup_steps: 500

paths:
  output_dir: output_stage1_local_coc

evaluate:
  eval_ckpt: null

task_name: alpamayo_1_5_sft_stage1_local_coc
